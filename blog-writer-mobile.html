:root{--navy:#042A61;--blue:#0857C3;--sky:#307FE2;--light:#71C5E8;--ice:#D6EFFB;--amber:#C37408;
--bg:#F3F7FC;--surface:#fff;--text:#0F2447;--muted:#5B6B85;--border:#DCE6F3;--hover:#E8F1FC;--primary:#0857C3;--primary-fg:#fff;--code:#042A61;--codefg:#D6EFFB;--ring:rgba(48,127,226,.35);--kb:0px;--bar:52px}
@media(prefers-color-scheme:dark){:root{--bg:#071326;--surface:#0D1D38;--text:#E6EEFB;--muted:#93A4C3;--border:#1E3358;--hover:#14284A;--primary:#307FE2;--code:#050F20;--ring:rgba(113,197,232,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
header.top{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--navy);color:#fff}
.logo{font-weight:700;font-size:15px;margin-right:auto;padding-left:4px}.logo span{color:var(--light)}
.hb{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:0 12px;height:40px;font-weight:600;font-size:14px;cursor:pointer}
.hb.primary{background:var(--sky);border-color:var(--sky)}
@media(max-width:380px){.logo{display:none}.hb{padding:0 10px}header.top{justify-content:flex-end}}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(var(--bar) + var(--kb) + 90px)}
#title{width:100%;border:0;outline:0;background:transparent;font:700 26px/1.25 "Inter",system-ui,sans-serif;color:var(--navy);padding:6px 0;resize:none}
@media(prefers-color-scheme:dark){#title{color:#fff}}
#title::placeholder{color:var(--muted);opacity:.6}
#fname{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);padding:2px 0 12px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#editor{outline:0;font-size:17px;line-height:1.7;min-height:55vh;word-wrap:break-word;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
#editor.empty>p:first-child::before{content:"Start writing…";color:var(--muted);opacity:.6;pointer-events:none}
#editor h2,#editor h3,#editor h4{color:var(--navy);line-height:1.3;margin:1.4em 0 .5em}
@media(prefers-color-scheme:dark){#editor h2,#editor h3,#editor h4{color:var(--light)}}
#editor h2{font-size:1.5em}#editor h3{font-size:1.25em}#editor h4{font-size:1.1em}
#editor p{margin:0 0 1em}#editor a{color:var(--blue);text-decoration:underline}
@media(prefers-color-scheme:dark){#editor a{color:var(--light)}}
#editor blockquote{margin:1em 0;padding:.2em 1em;border-left:4px solid var(--sky);color:var(--muted);background:var(--surface);border-radius:0 8px 8px 0}
#editor code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--ice);color:var(--navy);padding:.1em .35em;border-radius:4px}
@media(prefers-color-scheme:dark){#editor code{background:var(--hover);color:var(--light)}}
#editor pre{position:relative;background:var(--code);color:var(--codefg);padding:28px 14px 12px;border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-x:auto;margin:1em 0}
#editor pre::before{content:attr(data-lang);position:absolute;top:7px;right:12px;font:600 11px "Inter",sans-serif;text-transform:uppercase;letter-spacing:.8px;color:var(--light)}
#editor pre code{background:none;color:inherit;padding:0;font-size:inherit}
#editor img{max-width:100%;border-radius:6px}
#editor figure{margin:1.2em 0;text-align:center}#editor figcaption{font-size:.85em;color:var(--muted);margin-top:6px;outline:0}
#editor figcaption:empty::before{content:"Add a caption…";opacity:.5}
#editor hr{border:0;border-top:2px solid var(--border);margin:1.5em 0}
#editor table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}#editor th,#editor td{border:1px solid var(--border);padding:6px 9px}
#editor [data-notice]{margin:1em 0;padding:.8em 1em .1em;border-radius:10px;background:var(--ice);border-left:5px solid var(--sky);color:var(--navy)}
#editor .raw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;background:var(--surface);border:1px dashed var(--sky);border-radius:8px;padding:8px 10px;margin:1em 0;color:var(--muted)}
#stats{font-size:12px;color:var(--muted);margin-top:18px}
/* toolbar pinned above the keyboard */
.bar{position:fixed;left:0;right:0;bottom:var(--kb);z-index:30;height:calc(var(--bar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;gap:2px;align-items:center;overflow-x:auto;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(4,42,97,.08);scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-left:6px;padding-right:6px}
.bar::-webkit-scrollbar{display:none}
.tb{flex:none;min-width:44px;height:44px;border:0;background:transparent;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;padding:0 8px}
.tb:active,.tb.on{background:var(--ice);color:var(--navy)}
@media(prefers-color-scheme:dark){.tb:active,.tb.on{background:var(--sky);color:#fff}}
.sep{flex:none;width:1px;height:24px;background:var(--border);margin:0 4px}
/* sheets */
dialog{border:0;padding:0;color:var(--text);background:var(--surface);box-shadow:0 -10px 50px rgba(4,42,97,.4)}
dialog::backdrop{background:rgba(4,42,97,.5)}
dialog.sheet,dialog#dlg{width:100%;max-width:640px;max-height:92dvh;margin:auto auto 0;border-radius:20px 20px 0 0;overflow:auto;-webkit-overflow-scrolling:touch}
@media(min-width:700px){dialog.sheet,dialog#dlg{margin:auto;border-radius:16px;max-height:86vh}}
.sh{padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sh h3{margin:0 0 12px;font-size:18px;color:var(--navy)}@media(prefers-color-scheme:dark){.sh h3{color:var(--light)}}
.sh .x{position:absolute;top:10px;right:12px;width:40px;height:40px;border:0;background:var(--hover);border-radius:50%;font-size:20px;cursor:pointer}
.f{margin-bottom:14px}.f>label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.f input[type=text],.f input[type=date],.f input[type=number],.f textarea,.f select,.f input[type=url]{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:var(--bg);min-height:46px}
.f textarea{resize:vertical;min-height:70px}

<script>
const SITE='https://saltfarmer.github.io/blog';
const CATS=['Journal','Python','Pandas','Data Wrangling','Visualization','Classification','Regression','Clustering','Deep Learning','Scoring','Tips','Dota','Data Science Project','TOEFL'];
const LANGS=['text','python','r','bash','sql','javascript','html','css','yaml','json','rust','markdown','java','c','cpp'];
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA=s=>esc(s).replace(/"/g,'&quot;');
const ed=$('#editor');

/* ================= Markdown -> HTML ================= */
const KNOWNTAGS=/^(a|abbr|address|b|br|button|cite|code|del|details|div|em|font|i|iframe|img|ins|kbd|mark|p|pre|q|s|small|span|strong|sub|summary|sup|u|center|table|thead|tbody|tr|td|th|figure|figcaption|li|ul|ol|h[1-6]|hr|blockquote|video|audio|source|label|input|dl|dt|dd|section|article|nav|aside|style|script)$/i;
function inlineMd(src){
  const store=[];const hold=h=>{store.push(h);return '\u0000'+(store.length-1)+'\u0000';};
  let s=src;
  s=s.replace(/\\([\\`*_{}\[\]()#+\-.!|<>~])/g,(m,c)=>hold(esc(c)));
  s=s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g,(m,t,c)=>hold('<code>'+esc(c.trim())+'</code>'));
  s=s.replace(/<(https?:\/\/[^>\s]+)>/g,(m,u)=>hold('<a href="'+escA(u)+'">'+esc(u)+'</a>'));
  s=s.replace(/<\/?([a-zA-Z][a-zA-Z0-9]*)\b[^<>]*>/g,(m,t)=>KNOWNTAGS.test(t)?hold(m):m);
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,(m,a,u,t)=>hold('<img src="'+u+'" alt="'+a+'"'+(t?' title="'+t+'"':'')+'>'));
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,(m,a,u,t)=>hold('<a href="'+u+'"'+(t?' title="'+t+'"':'')+'>')+a+hold('</a>'));
  s=s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g,'$1<strong>$2</strong>');
  s=s.replace(/\*(?=\S)([\s\S]*?\S)\*/g,'<em>$1</em>');
  s=s.replace(/(^|[^\w])_(?=\S)([\s\S]*?\S)_(?!\w)/g,'$1<em>$2</em>');
  s=s.replace(/~~(?=\S)([\s\S]*?\S)~~/g,'<del>$1</del>');
  s=s.replace(/ {2,}\n|\\\n/g,'<br>\n');
  for(let k=0;k<3;k++)s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>store[i]);
  return s;
}
const BLANK=l=>/^\s*$/.test(l);
const LISTRE=/^\s*([-*+]|\d+[.)])\s+\S/;
const HRRE=/^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
const SEPRE=/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
const HTMLBLK=/^\s*<(figure|div|table|iframe|pre|details|center|p|h[1-6]|ul|ol|blockquote|hr|img|a|br|span|video|audio|script|style|section|nav|aside)\b/i;
function startsBlock(l,next){
  if(/^\s{0,3}(#{1,6}\s|>|```|~~~|\{%|\{:)/.test(l)||HRRE.test(l))return true;
  if(/^\s*([-*+])\s+\S/.test(l)||/^\s*1[.)]\s+\S/.test(l))return true;
  if(/^\s*<(figure|div|table|iframe|pre|details|center|ul|ol|blockquote|hr)\b/i.test(l))return true;
  if(next!==undefined&&l.includes('|')&&SEPRE.test(next)&&next.includes('-')&&next.includes('|'))return true;
  return false;
}
function splitRow(r){r=r.trim().replace(/^\|/,'').replace(/\|$/,'');return r.split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));}
function noticeHtml(cls,inner){return '<div data-notice="'+cls+'">'+inner+'</div>';}
function preHtml(code,lang){return '<pre data-lang="'+escA(lang||'text')+'"><code>'+esc(code)+'</code></pre>';}
function rawHtml(text){return '<div class="raw" data-raw contenteditable="plaintext-only">'+esc(text)+'</div>';}
function buildFigure(o){
  const fig=document.createElement('figure');fig.contentEditable='false';
  if(o.cls)fig.dataset.fclass=o.cls;
  let inner=o.img;
  if(o.href){const a=document.createElement('a');a.setAttribute('href',o.href);a.appendChild(o.img);inner=a;}
  fig.appendChild(inner);
  const fc=document.createElement('figcaption');fc.contentEditable='true';fc.innerHTML=o.cap||'';fig.appendChild(fc);
  return fig.outerHTML;
}
function figFromHtml(raw){
  const t=document.createElement('template');t.innerHTML=raw.trim();
  const f=t.content.querySelector('figure');if(!f)return null;
  const img=f.querySelector('img');if(!img)return null;
  const a=f.querySelector('a');const cap=f.querySelector('figcaption');
  return buildFigure({img:img.cloneNode(true),href:a?a.getAttribute('href'):null,cap:cap?cap.innerHTML.trim():'',cls:f.getAttribute('class')});
}
function mdToHtml(md){
  const L=md.replace(/\r\n?/g,'\n').split('\n');let i=0;const out=[];
  const takeNotice=()=>{const m=i<L.length&&L[i].match(/^\{:\s*\.(notice[\w-]*)\s*\}\s*$/);if(m){i++;return m[1];}return null;};
  while(i<L.length){
    const l=L[i];let m;
    if(BLANK(l)){i++;continue;}
    if((m=l.match(/^\s*(```+|~~~+)\s*([\w+#.-]*)\s*$/))){
      const fc=m[1][0],lang=m[2],code=[];i++;
      while(i<L.length&&!new RegExp('^\\s*'+fc+'{3,}\\s*$').test(L[i])){code.push(L[i]);i++;}
      i++;out.push(preHtml(code.join('\n'),lang));continue;
    }
    if((m=l.match(/^\s*\{%\s*(highlight|raw)\b/))){
      const end=m[1]==='highlight'?'endhighlight':'endraw',buf=[];
      const endRe=new RegExp('\\{%\\s*'+end+'\\s*%\\}');
      while(i<L.length){buf.push(L[i]);i++;if(endRe.test(buf[buf.length-1]))break;}
      out.push(rawHtml(buf.join('\n')));continue;
    }
    if(/^\s*(\{%|\{:)/.test(l)){const buf=[];while(i<L.length&&!BLANK(L[i])){buf.push(L[i]);i++;}out.push(rawHtml(buf.join('\n')));continue;}
    if((m=l.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/))){out.push('<h'+m[1].length+'>'+inlineMd(m[2])+'</h'+m[1].length+'>');i++;continue;}
    if(HRRE.test(l)){out.push('<hr>');i++;continue;}
    if(/^\s{0,3}>/.test(l)){
      const buf=[];
      while(i<L.length&&(/^\s{0,3}>/.test(L[i])||(!BLANK(L[i])&&buf.length&&!startsBlock(L[i])))){buf.push(L[i].replace(/^\s{0,3}>\s?/,''));i++;}
      const inner=mdToHtml(buf.join('\n'));const n=takeNotice();
      out.push(n?noticeHtml(n,inner):'<blockquote>'+inner+'</blockquote>');continue;
    }
    if(l.includes('|')&&i+1<L.length&&SEPRE.test(L[i+1])&&L[i+1].includes('-')&&L[i+1].includes('|')){
      const head=splitRow(l);i+=2;const rows=[];
      while(i<L.length&&!BLANK(L[i])&&L[i].includes('|')){rows.push(splitRow(L[i]));i++;}
      let h='<table><thead><tr>'+head.map(c=>'<th>'+inlineMd(c)+'</th>').join('')+'</tr></thead><tbody>';
      rows.forEach(r=>{h+='<tr>'+head.map((_,k)=>'<td>'+inlineMd(r[k]||'')+'</td>').join('')+'</tr>';});
      out.push(h+'</tbody></table>');continue;
    }
    if(LISTRE.test(l)){const r=parseList(L,i);out.push(r[0]);i=r[1];continue;}
    if(HTMLBLK.test(l)){
      const tag=l.match(/^\s*<([a-zA-Z0-9]+)/)[1].toLowerCase();const buf=[];
      const closes=['figure','div','table','pre','details','iframe','ul','ol','blockquote','script','style','section'].includes(tag);
      const closeRe=new RegExp('</'+tag+'\\s*>','i');
      while(i<L.length){
        if(closes){buf.push(L[i]);i++;if(closeRe.test(buf[buf.length-1]))break;}
        else{if(BLANK(L[i]))break;buf.push(L[i]);i++;}
      }
      const raw=buf.join('\n');
      if(tag==='figure'){const f=figFromHtml(raw);if(f){out.push(f);continue;}}
      out.push(rawHtml(raw));continue;
    }
    const buf=[l];i++;
    while(i<L.length&&!BLANK(L[i])&&!startsBlock(L[i],L[i+1])){buf.push(L[i]);i++;}
    const txt=buf.map(s=>s.replace(/^\s+/,'')).join('\n').replace(/\s+$/,'');
    const n=takeNotice();const p='<p>'+inlineMd(txt)+'</p>';
    out.push(n?noticeHtml(n,p):p);
  }
  return out.join('\n');
}
function parseList(L,i){
  const base=L[i].match(/^\s*/)[0].length,ordered=/^\s*\d/.test(L[i]),items=[];let cur=null;
  const isItem=s=>/^\s*([-*+]|\d+[.)])\s+/.test(s);
  while(i<L.length){
    const l=L[i];
    if(BLANK(l)){
      let j=i;while(j<L.length&&BLANK(L[j]))j++;
      if(j>=L.length)break;
      const ind=L[j].match(/^\s*/)[0].length;
      if(ind>base||(ind===base&&isItem(L[j])&&ordered===/^\s*\d/.test(L[j]))){if(cur)cur.push('');i=j;continue;}
      break;
    }
    const ind=l.match(/^\s*/)[0].length,im=l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if(ind===base&&im){if(ordered!==/\d/.test(im[2]))break;cur=[im[3]];items.push(cur);i++;continue;}
    if(ind>base&&cur){cur.push(l.slice(Math.min(ind,base+(ordered?3:2))));i++;continue;}
    if(ind<=base&&!im&&cur&&!startsBlock(l,L[i+1])&&!HRRE.test(l)){cur.push(l.trim());i++;continue;}
    break;
  }
  const tag=ordered?'ol':'ul';
  const html=items.map(it=>{let h=mdToHtml(it.join('\n'));h=h.replace(/^<p>([\s\S]*?)<\/p>/,'$1');return '<li>'+h+'</li>';}).join('');
  return ['<'+tag+'>'+html+'</'+tag+'>',i];
}

/* ================= HTML -> Markdown ================= */
const INLINE=new Set(['A','B','STRONG','I','EM','U','S','STRIKE','DEL','CODE','SPAN','BR','IMG','SUP','SUB','MARK','KBD','FONT','SMALL','ABBR','LABEL']);
const imgSrc=im=>{const p=im.dataset.path;if(p&&p.startsWith('/')&&!p.startsWith('//'))return '{{site.baseurl}}'+p;return p||im.getAttribute('src')||'';};
function escText(s){
  return s.replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\*/g,'\\*').replace(/`/g,'\\`').replace(/<(?=[A-Za-z\/!])/g,'&lt;')
    .replace(/(?<![A-Za-z0-9])_|_(?![A-Za-z0-9])/g,'\\_');
}
function wrapMark(inner,mark){const m=inner.match(/^(\s*)([\s\S]*?)(\s*)$/);return m[2]?m[1]+mark+m[2]+mark+m[3]:inner;}
function inlineOf(nodes,inCell){const a=Array.from(nodes);while(a.length&&a[a.length-1].nodeType===1&&a[a.length-1].tagName==='BR')a.pop();return a.map(n=>inlineNode(n,inCell)).join('');}
function inlineNode(n,inCell){
  if(n.nodeType===3)return escText(n.nodeValue);
  if(n.nodeType!==1)return '';
  const t=n.tagName,kids=()=>inlineOf(n.childNodes,inCell);
  switch(t){
    case 'STRONG':case 'B':return wrapMark(kids(),'**');
    case 'EM':case 'I':return wrapMark(kids(),'*');
    case 'DEL':case 'S':case 'STRIKE':return wrapMark(kids(),'~~');
    case 'CODE':{const c=n.textContent;return c?(c.includes('`')?'`` '+c+' ``':'`'+c+'`'):'';}
    case 'BR':return inCell?'<br>':'  \n';
    case 'IMG':{const ti=n.getAttribute('title');return '!['+(n.getAttribute('alt')||'')+']('+imgSrc(n)+(ti?' "'+ti+'"':'')+')';}
    case 'A':{const h=n.getAttribute('href');const k=kids();if(!h)return k;const ti=n.getAttribute('title');return '['+k+']('+h+(ti?' "'+ti+'"':'')+')';}
    case 'U':case 'SUP':case 'SUB':case 'MARK':case 'KBD':case 'SMALL':case 'ABBR':{const tg=t.toLowerCase();return '<'+tg+'>'+kids()+'</'+tg+'>';}
    case 'SPAN':{const c=n.getAttribute('class');return c?'<span class="'+c+'">'+kids()+'</span>':kids();}
    default:return kids();
  }
}
function blocks(parent){
  const out=[];let inl=[];
  const flush=()=>{if(inl.length){let t=inlineOf(inl).trim();if(t){if(/^(#{1,6}\s|[-+*]\s|\d+[.)]\s|>)/.test(t))t='\\'+t;out.push(t);}inl=[];}};
  for(const n of parent.childNodes){
    if(n.nodeType===3||(n.nodeType===1&&INLINE.has(n.tagName))){inl.push(n);continue;}
    flush();if(n.nodeType!==1)continue;
    const b=blockOf(n);if(b!==null&&b!=='')out.push(b);
  }
  flush();return out;
}
const joinBlocks=a=>a.reduce((s,b,k)=>k===0?b:s+(b.startsWith('{:')?'\n':'\n\n')+b,'');
function attrStr(el,skip){return Array.from(el.attributes).filter(a=>!skip.includes(a.name)&&!a.name.startsWith('data-')&&a.name!=='contenteditable'&&a.name!=='draggable').map(a=>' '+a.name+'="'+escA(a.value)+'"').join('');}
function figMd(n){
  const img=n.querySelector('img');if(!img)return '';
  const a=n.querySelector('a'),cap=n.querySelector('figcaption');
  const im='<img src="'+escA(imgSrc(img))+'"'+(img.getAttribute('alt')?' alt="'+escA(img.getAttribute('alt'))+'"':'')+attrStr(img,['src','alt','data-path','data-file'])+'>';

function applyFm(fm){

      case 'share':st.share=bool(e);break;
      case 'toc':st.toc=bool(e);break;
      case 'lang':st.lang=unq(e.val)||'en';break;
      case 'series':st.series=unq(e.val);break;
      case 'series_order':st.order=unq(e.val);break;
      case 'takeaways':st.takeaways=listVals(e);break;
      case 'colab':st.colab=unq(e.val);break;
      case 'notebook':st.notebook=unq(e.val);break;
      case 'dataset':st.dataset=unq(e.val);break;
      case 'last_modified_at':{const d=unq(e.val).match(/\d{4}-\d{2}-\d{2}/);st.modified=d?d[0]:'';break;}
      case 'featured':st.featured=bool(e);break;

      case 'header':

function buildFm(){

function Chips(el,sugg,onchange,sel){
  const o={vals:[],set(v){o.vals=[...new Set(v)];draw();},add(v){v=v.trim().replace(/,$/,'');if(v&&!o.vals.includes(v)){o.vals.push(v);draw();onchange();}}};

    el.innerHTML='';

    const inp=document.createElement('input');inp.type='text';inp.placeholder=o.vals.length?'':'Type and press Enter';el.appendChild(inp);
    inp.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();o.add(inp.value);inp.focus();}else if(e.key==='Backspace'&&!inp.value&&o.vals.length){o.vals.pop();draw();onchange();el.querySelector('input').focus();}};

function ask(title,fields,okLabel='Insert'){

  ensureTail();
  if($('#autoName').checked)$('#filename').value=autoFilename();
  $('#fname').textContent=$('#filename').value;
  const words=(ed.innerText.trim().match(/\S+/g)||[]).length;
  $('#sWords').textContent=words+' words';$('#sRead').textContent=Math.max(1,Math.round(words/180))+' min read';
  try{localStorage.setItem('bwm.draft',JSON.stringify({md:fullMd(),filename:$('#filename').value,auto:$('#autoName').checked,lower:$('#lower').checked,date:$('#date').value}));$('#sSave').textContent='Draft saved';}
  catch(e){$('#sSave').textContent='Draft not saved';}
}
function download(){
  render();const name=$('#filename').value||autoFilename();
  if(!$('#title').value.trim()){toast('Add a title first');$('#title').focus();return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([fullMd()],{type:'text/markdown;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Downloaded '+name);
}

/* ================= Sheets ================= */
function openSheet(id){const d=$(id);if(!d.open)d.showModal();}
document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c){const d=c.closest('dialog');if(d)d.close();}});
$$('dialog.sheet').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close();}));
$('#bDetails').onclick=()=>openSheet('#sheetDetails');
$('#bPreview').onclick=()=>{render();$('#md').value=fullMd();$('#pvName').textContent=$('#filename').value;openSheet('#sheetPreview');};
$('#bDown').onclick=download;$('#bDown2').onclick=download;
['date','useDate','filename','autoName','lower','teaser','excerpt','comments','share','toc','extra','lang','series','seriesOrder','takeaways','colab','notebook','dataset','modified','featured'].forEach(id=>$('#'+id).addEventListener('input',()=>{if(id==='filename')$('#autoName').checked=false;sync();}));
$('#bNew').onclick=()=>{if(!confirm('Start a new post? The current draft will be cleared.'))return;
  localStorage.removeItem('bwm.draft');$('#title').value='';autoGrow();setBody('');cats.set([]);tags.set([]);
  ['teaser','excerpt','extra','series','seriesOrder','takeaways','colab','notebook','dataset','modified'].forEach(id=>$('#'+id).value='');
  $('#date').value=new Date().toLocaleDateString('en-CA');$('#useDate').checked=false;$('#comments').checked=true;$('#share').checked=true;$('#toc').checked=true;$('#autoName').checked=true;$('#lang').value='en';$('#featured').checked=false;
  $('#sheetDetails').close();sync();toast('New post');};
$('#bHelp').onclick=()=>{$('#sheetDetails').close();const f=$('#dform');f.onsubmit=e=>e.preventDefault();$('#dlg').oncancel=null;
  f.innerHTML=`<button class="x" type="button" data-close aria-label="Close">×</button><h3>Quick help</h3><div class="help">
<p><b>Write:</b> type the title, then the post. Use the bar at the bottom (swipe it sideways for more buttons).</p>
<ul><li><b>H2 / H3</b> section headings. The title is already the page heading.</li>
<li><b>Code</b> adds a code block. Tap <b>Code</b> again while inside one to leave it.</li>
<li><b>Image</b> takes a link only (https://… or a repo path like <code>/assets/images/pic.png</code>).</li></ul>
<p><b>Details</b> holds the category, language, teaser image link, excerpt, and series.</p>
<ul><li><b>Excerpt:</b> a 1–2 sentence summary shown in post lists. Leave empty to use the first paragraph.</li>
<li><b>Series + part #:</b> for multi-part posts. Same name on every part.</li>
<li><b>Key takeaways:</b> 2–4 short points shown at the top of long posts.</li></ul>
<p><b>Download</b> saves <code>YYYY-MM-DD-Title.md</code>. Move it into your repo's <code>_posts</code> folder, and upload any images to <code>assets/images</code> on GitHub.</p>
<p>Your draft saves automatically on this phone.</p></div><div class="acts"><button class="btn primary" type="button" data-close>Got it</button></div>`;
  $('#dlg').classList.remove('wide');$('#dlg').showModal();};

/* ================= Init ================= */
cats=Chips($('#catChips'),CATS,sync,$('#catSugg'));
tags=Chips($('#tagChips'),[],sync);
$('#date').value=new Date().toLocaleDateString('en-CA');
try{
  const d=JSON.parse(localStorage.getItem('bwm.draft')||'null');
  if(d&&d.md){importMd(d.md);if(d.date)$('#date').value=d.date;$('#lower').checked=!!d.lower;$('#autoName').checked=d.auto!==false;if(d.auto===false&&d.filename)$('#filename').value=d.filename;}
}catch(e){}
autoGrow();sync();render();

</script>
</body>
</html>
